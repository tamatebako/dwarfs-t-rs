name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match the builtin-baseline in dwarfs-t/vcpkg.json so that manifest
  # baseline resolution works (mirrors dwarfs-t's own CI).
  VCPKG_COMMIT: f14401ca0f2754347c3864da7488a9b955b4e47a

# All actions are pinned by commit SHA (the tag each SHA corresponds to is
# noted in the comment); update both together.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      # packages:write populates the org's GitHub Packages vcpkg binary
      # cache (ci/vcpkg-nuget-cache.sh); fork PRs are auto-downgraded to
      # read-only, where pushes degrade to a non-fatal vcpkg note.
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, triplet: x64-linux-static }
          - { os: macos-14, triplet: arm64-osx-static }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root and exports
        # DWARFS_RS_VCPKG_INSTALLED_DIR into GITHUB_ENV.
        run: |
          bash dwarfs-t/ci/vcpkg-baseline-restore.sh dwarfs-t \
            "${{ matrix.triplet }}" \
            || echo "baseline miss — ports build normally"

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install native build tools (ubuntu)
        if: runner.os == 'Linux'
        # mono-complete: vcpkg's NuGet binary-cache provider drives
        # nuget.exe through mono on non-Windows (macos runners ship mono).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake autoconf-archive libtool \
            curl zip unzip tar ca-certificates \
            mono-complete

      - name: Install native build tools (macos)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf automake autoconf-archive libtool

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      # run-vcpkg@v11 injects VCPKG_BINARY_SOURCES=clear;x-gha,readwrite,
      # and vcpkg removed x-gha (2025.06) — that spec is zero binary cache,
      # and it also neutered the old actions/cache over the archives dir
      # (files provider cleared + archives path redirected). The override
      # is the org's GitHub Packages NuGet feed; the dead cache step is
      # gone (details in ci/vcpkg-nuget-cache.sh).
      - name: Configure the vcpkg binary cache (GitHub Packages NuGet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/vcpkg-nuget-cache.sh

      - name: cargo test
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: cargo test --workspace

      # clippy executes build scripts (the whole native build runs), so it
      # lives in this job where vcpkg is already set up and warm.
      - name: clippy
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

  # The pure-cargo skeleton (--no-default-features): no vcpkg, no CMake, no
  # submodule — consumers must always be able to build (and test the ENOTSUP
  # behavior of) the crate without the native toolchain. Also simulates the
  # docs.rs build (DOCS_RS skips the native build with default features on).
  skeleton:
    name: skeleton + docs.rs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No submodules: the skeleton must not need the dwarfs-t sources.

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: cargo check (skeleton)
        run: cargo check --workspace --no-default-features

      - name: cargo test (skeleton)
        run: cargo test --workspace --no-default-features

      - name: clippy (skeleton)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: cargo doc (docs.rs simulation)
        env:
          DOCS_RS: "1"
        run: cargo doc --workspace --no-deps

  # Windows skeleton leg: the pure-cargo ENOTSUP skeleton must build, test
  # and lint for the MSVC target. A vendored (default-features) Windows leg
  # is deliberately absent: the vendored build (x64-windows-static-md
  # triplet, /MD) is wired in dwarfs-t-sys/build.rs but not yet proven on a
  # Windows runner — see README "Windows and the CRT".
  skeleton-windows:
    name: skeleton (windows, msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No submodules: the skeleton must not need the dwarfs-t sources.

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: cargo check (skeleton)
        run: cargo check --workspace --no-default-features --target x86_64-pc-windows-msvc

      - name: cargo test (skeleton)
        run: cargo test --workspace --no-default-features --target x86_64-pc-windows-msvc

      - name: clippy (skeleton)
        run: cargo clippy --workspace --all-targets --no-default-features --target x86_64-pc-windows-msvc -- -D warnings

  # The vendored windows-gnu (ucrt64) leg: dwarfs-t cross-compiles with
  # the msys2 ucrt64 gcc (ONE toolchain across the ecosystem — the
  # factory's ruby link uses it; the choco mingw's emutls/pthread_once
  # internals differ and the skew crashes worker threads at runtime).
  # Git-bash steps + get-cmake; setup-msys2's /usr/bin stays OFF PATH
  # (vcpkg's downloaded msys2 ABI-clashes with it — the autotools ports
  # die in `make install` otherwise).
  windows-gnu:
    name: vendored (windows, ucrt64)
    runs-on: windows-latest
    permissions:
      # packages:write populates the org's GitHub Packages vcpkg binary
      # cache (ci/vcpkg-nuget-cache.sh); fork PRs are auto-downgraded to
      # read-only, where pushes degrade to a non-fatal vcpkg note.
      contents: read
      packages: write
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
      # Static-link the mingw C++ runtimes (first-DLL-wins resolution on
      # the runner is STATUS_ENTRYPOINT_NOT_FOUND at process start);
      # trailing -lmsvcrt restores the msvcrt-after-mingwex order
      # invariant rustc's -nodefaultlibs tail violates (factory probe).
      RUSTFLAGS: -C link-arg=-static-libgcc -C link-arg=-static-libstdc++ -C link-arg=-lmsvcrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up MSys2 (ucrt64 toolchain)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-gdb mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root (C:/vcpkg-inst — also the
        # MAX_PATH dodge) and exports DWARFS_RS_VCPKG_INSTALLED_DIR.
        run: |
          bash dwarfs-t/ci/vcpkg-baseline-restore.sh dwarfs-t \
            x64-mingw-static \
            || echo "baseline miss — ports build normally"

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-gnu

      # cmake + ninja come from the ucrt64 toolchain (setup-msys2 above):
      # the closed PATH discipline in ci/windows-gnu.sh deliberately
      # excludes every other bin dir, so get-cmake's paths would be dead.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      # See the test job: run-vcpkg's injected x-gha spec is zero binary
      # cache since vcpkg 2025.06 removed the provider; the org's GitHub
      # Packages NuGet feed replaces it (ci/vcpkg-nuget-cache.sh).
      - name: Configure the vcpkg binary cache (GitHub Packages NuGet)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/vcpkg-nuget-cache.sh

      - name: Cache the cargo target dir
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .

      - name: cargo build + test (vendored, windows-gnu)
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        # Everything lives in ci/windows-gnu.sh (reviewed, shellcheck-able)
        # — never inline run-blocks; they get string-edited and break silently.
        run: bash ci/windows-gnu.sh

      - name: Dump vcpkg build logs on failure
        if: failure()
        shell: bash
        run: |
          for f in .vcpkg-root/buildtrees/*/build-x64-mingw-static-*-err.log .vcpkg-root/buildtrees/*/install-x64-mingw-static-*-err.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            tail -40 "$f"
          done

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
