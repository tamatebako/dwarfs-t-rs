name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match the builtin-baseline in dwarfs-t/vcpkg.json so that manifest
  # baseline resolution works (mirrors dwarfs-t's own CI).
  VCPKG_COMMIT: f14401ca0f2754347c3864da7488a9b955b4e47a

# All actions are pinned by commit SHA (the tag each SHA corresponds to is
# noted in the comment); update both together.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install native build tools (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake autoconf-archive libtool \
            curl zip unzip tar ca-certificates

      - name: Install native build tools (macos)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf automake autoconf-archive libtool

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/vcpkg
            ~/Library/Caches/vcpkg
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('dwarfs-t/vcpkg.json', 'dwarfs-t/vcpkg_ports/**', 'dwarfs-t/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      - name: cargo test
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: cargo test --workspace

      # clippy executes build scripts (the whole native build runs), so it
      # lives in this job where vcpkg is already set up and warm.
      - name: clippy
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

  # The pure-cargo skeleton (--no-default-features): no vcpkg, no CMake, no
  # submodule — consumers must always be able to build (and test the ENOTSUP
  # behavior of) the crate without the native toolchain. Also simulates the
  # docs.rs build (DOCS_RS skips the native build with default features on).
  skeleton:
    name: skeleton + docs.rs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # No submodules: the skeleton must not need the dwarfs-t sources.

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: cargo check (skeleton)
        run: cargo check --workspace --no-default-features

      - name: cargo test (skeleton)
        run: cargo test --workspace --no-default-features

      - name: clippy (skeleton)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: cargo doc (docs.rs simulation)
        env:
          DOCS_RS: "1"
        run: cargo doc --workspace --no-deps

  # Windows skeleton leg: the pure-cargo ENOTSUP skeleton must build, test
  # and lint for the MSVC target. A vendored (default-features) Windows leg
  # is deliberately absent: the vendored build (x64-windows-static-md
  # triplet, /MD) is wired in dwarfs-t-sys/build.rs but not yet proven on a
  # Windows runner — see README "Windows and the CRT".
  skeleton-windows:
    name: skeleton (windows, msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # No submodules: the skeleton must not need the dwarfs-t sources.

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: cargo check (skeleton)
        run: cargo check --workspace --no-default-features --target x86_64-pc-windows-msvc

      - name: cargo test (skeleton)
        run: cargo test --workspace --no-default-features --target x86_64-pc-windows-msvc

      - name: clippy (skeleton)
        run: cargo clippy --workspace --all-targets --no-default-features --target x86_64-pc-windows-msvc -- -D warnings

  # The vendored windows-gnu (ucrt64) leg: dwarfs-t cross-compiles with
  # the mingw toolchain and the safe crate links and tests on the runner
  # itself (windows-latest runs the PE binaries natively). The CRT note
  # above (x64-windows-static-md, /MD) is the MSVC flavor — the ucrt64
  # flavor is this one.
  #
  # Environment: dwarfs-t's own green windows-gcc CI shape — Git-bash
  # steps + the runner's built-in MinGW + get-cmake, NEVER an msys2
  # shell: vcpkg's autotools ports (the libiconv/openssl family) die in
  # `make install` when the port build is spawned from an msys2 shell
  # (three consecutive factory legs lost to it).
  windows-gnu:
    name: vendored (windows, ucrt64)
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
      # Static-link the MinGW C++ runtimes: the runner carries several
      # mingw installs (choco mingw, Strawberry perl's old gcc, …) and the
      # loader picks the FIRST libstdc++/libgcc/winpthread DLL on PATH —
      # a version mismatch there is STATUS_ENTRYPOINT_NOT_FOUND at
      # process start (proven on the smoke-test leg).
      RUSTFLAGS: -C link-arg=-static -C link-arg=-static-libgcc -C link-arg=-static-libstdc++
      # Short installed-tree root: the default (inside the cargo build
      # dir) pushes boost's deepest headers past MAX_PATH and mingw gcc
      # cannot open them.
      DWARFS_RS_VCPKG_INSTALLED_DIR: C:/vcpkg-inst
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-mingw-${{ hashFiles('dwarfs-t/vcpkg.json', 'dwarfs-t/vcpkg_ports/**', 'dwarfs-t/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-mingw-

      - name: cargo build (vendored, windows-gnu)
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --workspace --target x86_64-pc-windows-gnu

      - name: cargo test (vendored, windows-gnu)
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: |
          export PATH="/c/mingw64/bin:/c/Users/runneradmin/.cargo/bin:$PATH"
          # serialize: a parallel harness hides which test crashes
          cargo test --workspace --target x86_64-pc-windows-gnu -- --test-threads=1 --no-run
          # STATUS_ENTRYPOINT_NOT_FOUND forensics: enumerate every DLL the
          # test binaries import (the loader fails the process before main,
          # so the failure's own stderr never names the missing entry).
          for exe in target/x86_64-pc-windows-gnu/debug/deps/*.exe; do
            echo "=== imports: $exe ==="
            x86_64-w64-mingw32-objdump -p "$exe" | grep -E "DLL Name|^\s+[0-9a-f]+\s+\S+\s*$" | head -60 || true
          done
          # serialize: a parallel harness hides which test crashes
          cargo test --workspace --target x86_64-pc-windows-gnu -- --test-threads=1

      - name: Dump vcpkg build logs on failure
        if: failure()
        shell: bash
        run: |
          for f in .vcpkg-root/buildtrees/*/build-x64-mingw-static-*-err.log .vcpkg-root/buildtrees/*/install-x64-mingw-static-*-err.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            tail -40 "$f"
          done

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
